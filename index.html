<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備考詞語總複習－基礎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;800;900&family=Noto+Sans+SC:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2;
  --ink:#2b271f;
  --ink-soft:#6b6357;
  --card:#ffffff;
  --line:#e8e1d3;
  --basic-bg:#ffd9d3;
  --basic-ac:#d8574a;
  --basic-deep:#7a2a21;
  --advanced-bg:#bdeee7;
  --advanced-ac:#128f80;
  --advanced-deep:#0b5349;
  --mastery-bg:#cdf0bd;
  --mastery-ac:#4d9b32;
  --mastery-deep:#2c5a1c;
  --accent:#d8574a;
  --shadow:0 6px 18px rgba(43,39,31,.08);
  --shadow-lg:0 14px 34px rgba(43,39,31,.14);
  --radius:20px;
}
*{box-sizing:border-box;}
html{font-size:20px;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","Noto Sans SC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:1.5rem 1.5rem 4rem;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1.5rem;position:sticky;top:0;z-index:50;
  background:rgba(250,247,242,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:.7rem;cursor:pointer;}
.brand-mark{
  width:2.6rem;height:2.6rem;border-radius:12px;
  background:linear-gradient(135deg,var(--basic-bg),var(--advanced-bg) 50%,var(--mastery-bg));
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;
  box-shadow:inset 0 0 0 2px rgba(43,39,31,.06);
}
.brand-name{font-size:1.35rem;font-weight:900;letter-spacing:.02em;}
.brand-sub{font-size:.85rem;color:var(--ink-soft);font-weight:600;}
.toggle-group{display:flex;background:#efe9db;border-radius:999px;padding:.3rem;gap:.2rem;}
.toggle-btn{
  border:none;background:transparent;padding:.5rem 1.1rem;border-radius:999px;
  font-size:1rem;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;
}
.toggle-btn.active{background:var(--ink);color:#fff;}
.crumbbar{display:flex;align-items:center;gap:.6rem;margin:1.6rem 0 .4rem;flex-wrap:wrap;}
.crumb-back{
  border:2px solid var(--line);background:#fff;border-radius:999px;padding:.5rem 1.1rem;
  font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink);
}
.crumb-back:hover{border-color:var(--ink);}
.pill{
  display:inline-flex;align-items:center;gap:.4rem;padding:.4rem 1rem;border-radius:999px;
  font-weight:800;font-size:.95rem;
}
h1{font-size:2.5rem;margin:.2rem 0 .3rem;font-weight:900;letter-spacing:.01em;}
h2{font-size:1.9rem;margin:0 0 .5rem;font-weight:900;}
h3{font-size:1.4rem;margin:0 0 .4rem;font-weight:800;}
p.lead{font-size:1.15rem;color:var(--ink-soft);max-width:60ch;margin:.3rem 0 1.6rem;}

/* HOME */
.hero{padding:1.4rem 0 .6rem;}
.map-table{
  width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);margin:1.2rem 0 2.2rem;font-size:1rem;
}
.map-table th,.map-table td{padding:.85rem 1rem;text-align:left;border-bottom:1px solid var(--line);}
.map-table th{background:#f3efe4;font-size:.95rem;color:var(--ink-soft);font-weight:800;}
.map-table tr:last-child td{border-bottom:none;}
.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem;margin-top:1rem;}
@media(max-width:900px){.tier-grid{grid-template-columns:1fr;}}
.tier-card{
  border-radius:26px;padding:1.8rem 1.6rem;cursor:pointer;border:none;text-align:left;
  font-family:inherit;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s;
  position:relative;overflow:hidden;
}
.tier-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.tier-card .tier-title{font-size:1.7rem;font-weight:900;margin-bottom:.15rem;}
.tier-card .tier-sub{font-size:1.05rem;font-weight:700;opacity:.75;margin-bottom:1rem;}
.tier-card .tier-detail{font-size:.95rem;line-height:1.75;font-weight:600;opacity:.9;}
.tier-card .tier-cta{
  margin-top:1.2rem;display:inline-block;background:rgba(255,255,255,.65);
  padding:.5rem 1.1rem;border-radius:999px;font-weight:900;font-size:1rem;
}
.tier-basic{background:var(--basic-bg);color:var(--basic-deep);}
.tier-advanced{background:var(--advanced-bg);color:var(--advanced-deep);}
.tier-mastery{background:var(--mastery-bg);color:var(--mastery-deep);}
.note-box{
  background:#fff7e0;border:2px dashed #e0c569;border-radius:16px;padding:1rem 1.3rem;
  font-size:1rem;margin-top:1.6rem;color:#5c4a10;
}
.footer-credit{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-top:3rem;}

/* TIER DETAIL */
.level-row{display:flex;gap:.8rem;flex-wrap:wrap;margin:1.2rem 0 2rem;}
.level-chip{
  border:3px solid var(--line);background:#fff;border-radius:999px;padding:.7rem 1.5rem;
  font-size:1.15rem;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink);
}
.level-chip.active{border-color:var(--tier-ac,var(--accent));background:var(--tier-bg,#fff0ee);color:var(--tier-deep,var(--ink));}
.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.3rem;margin-top:.6rem;}
@media(max-width:900px){.module-grid{grid-template-columns:1fr;}}
.brand-note{font-size:.8rem;color:var(--ink-soft);font-weight:600;margin-top:.1rem;}
.hero-note{font-size:1rem;color:var(--ink-soft);font-weight:700;margin:-.6rem 0 1.2rem;}
.cat-tag{display:inline-block;background:var(--tier-bg,#eee);color:var(--tier-deep,#333);border-radius:999px;padding:.25rem .8rem;font-size:.9rem;font-weight:800;margin-bottom:.8rem;}
.type-input{font-family:inherit;font-size:1.2rem;font-weight:800;border:none;border-bottom:3px solid var(--tier-ac,var(--accent));background:var(--tier-bg,#fdf1ee);color:var(--ink);padding:.2rem .6rem;border-radius:8px 8px 0 0;width:6em;text-align:center;}
.pinyin-word{font-size:3.6rem;font-weight:900;text-align:center;margin:.8rem 0 1.4rem;}
.footer-credit-final{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-top:2rem;}
.module-card{
  background:var(--card);border-radius:var(--radius);padding:1.8rem 1.5rem;box-shadow:var(--shadow);
  cursor:pointer;border:3px solid transparent;text-align:left;font-family:inherit;
  transition:transform .15s,border-color .15s;
}
.module-card:hover{transform:translateY(-3px);border-color:var(--tier-ac,var(--accent));}
.module-icon{font-size:2.4rem;margin-bottom:.6rem;}
.module-card h3{font-size:1.5rem;}
.module-card p{color:var(--ink-soft);font-size:1rem;margin:.3rem 0 0;}
.stat-line{font-size:1rem;color:var(--ink-soft);margin-bottom:.4rem;}

/* CARDS / BUTTONS generic */
.btn{
  border:none;border-radius:14px;padding:.85rem 1.6rem;font-size:1.1rem;font-weight:800;
  cursor:pointer;font-family:inherit;background:var(--ink);color:#fff;
}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.secondary{background:#fff;color:var(--ink);border:2px solid var(--line);}
.btn.ghost{background:transparent;color:var(--ink-soft);}
.btn.tier{background:var(--tier-ac,var(--accent));}
.btn-row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;}

/* FLASHCARD */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:1.4rem;padding:1rem 0 3rem;}
.fc-progress{font-size:1.1rem;font-weight:800;color:var(--ink-soft);}
.fc-card{
  width:100%;max-width:640px;min-height:340px;background:var(--card);border-radius:28px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2.2rem;cursor:pointer;text-align:center;position:relative;border:4px solid var(--tier-bg,#eee);
}
.fc-word{font-size:4.2rem;font-weight:900;letter-spacing:.02em;}
.fc-hint{position:absolute;bottom:1.1rem;font-size:.95rem;color:var(--ink-soft);font-weight:700;}
.fc-back .fc-pinyin{font-size:1.9rem;font-weight:800;color:var(--tier-ac,var(--accent));margin-bottom:.5rem;}
.fc-back .fc-jp{font-size:1.6rem;font-weight:700;margin-bottom:.3rem;}
.fc-back .fc-word-small{font-size:2.2rem;font-weight:900;margin-bottom:.6rem;}
.fc-back .fc-en{font-size:1.25rem;font-weight:700;color:var(--ink);margin-bottom:.3rem;}
.fc-example{
  font-size:1.15rem;font-weight:700;color:var(--tier-deep,#444);background:var(--tier-bg,#f4f0e6);
  border-radius:12px;padding:.6rem 1rem;margin-top:.7rem;max-width:34ch;line-height:1.5;cursor:pointer;
}
.fc-example-audio{opacity:.7;}
.fc-example-pending{background:transparent;color:var(--ink-soft);font-weight:600;font-size:1rem;cursor:default;}
.fc-empty{color:var(--ink-soft);font-size:1.2rem;}
.fc-controls{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;justify-content:center;}
.icon-btn{
  width:3.2rem;height:3.2rem;border-radius:50%;border:2px solid var(--line);background:#fff;
  font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.icon-btn.active{background:var(--tier-ac,var(--accent));border-color:var(--tier-ac,var(--accent));color:#fff;}
.unfam-btn{
  border-radius:999px;border:2px solid #e0c569;background:#fff7e0;color:#7a5f0a;
  padding:.6rem 1.3rem;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;
}
.unfam-btn.on{background:#f2b93b;color:#3d2e00;border-color:#a9820b;}

/* LISTEN MODULE */
.listen-wrap{display:flex;flex-direction:column;align-items:center;gap:1.6rem;padding:1rem 0 3rem;}
.speaker-btn{
  width:6.5rem;height:6.5rem;border-radius:50%;border:none;background:var(--tier-ac,var(--accent));
  color:#fff;font-size:2.6rem;cursor:pointer;box-shadow:var(--shadow-lg);
}
.speaker-btn:active{transform:scale(.96);}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:640px;}
@media(max-width:600px){.opt-grid{grid-template-columns:1fr;}}
.opt-btn{
  background:#fff;border:3px solid var(--line);border-radius:16px;padding:1.2rem;font-size:1.6rem;
  font-weight:800;cursor:pointer;font-family:inherit;
}
.opt-btn.correct{background:#dff5d6;border-color:#4d9b32;color:#2c5a1c;}
.opt-btn.wrong{background:#fbdcd8;border-color:#c8453a;color:#7a2016;}
.opt-btn:disabled{cursor:default;}
.score-badges{display:flex;gap:1rem;font-size:1.05rem;font-weight:800;}
.badge-good{color:#2c5a1c;} .badge-bad{color:#7a2016;}

/* CLOZE MODULE */
.cloze-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.8rem;max-width:760px;margin:0 auto;}
.chip-bank{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1.6rem;}
.chip{
  background:var(--tier-bg,#eee);color:var(--tier-deep,#333);border-radius:999px;padding:.55rem 1.2rem;
  font-size:1.25rem;font-weight:800;border:2px solid transparent;
}
.cloze-sentence{font-size:1.35rem;line-height:2.3;margin:1.1rem 0;}
.blank-select{
  font-family:inherit;font-size:1.2rem;font-weight:800;border:none;border-bottom:3px solid var(--tier-ac,var(--accent));
  background:var(--tier-bg,#fdf1ee);color:var(--ink);padding:.2rem .6rem;border-radius:8px 8px 0 0;min-width:4.5rem;text-align:center;
}
.blank-select.correct{background:#dff5d6;border-color:#4d9b32;}
.blank-select.wrong{background:#fbdcd8;border-color:#c8453a;}
.cloze-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;flex-wrap:wrap;gap:.8rem;}
.cloze-progress{font-weight:800;color:var(--ink-soft);}
.answer-reveal{margin-top:1rem;background:#f3efe4;border-radius:14px;padding:1rem 1.3rem;font-size:1.05rem;display:none;}
.answer-reveal.show{display:block;}
.disclaimer{font-size:.85rem;color:var(--ink-soft);margin-top:.6rem;}

@media(max-width:600px){
  html{font-size:18px;}
  .wrap{padding:1rem 1rem 3rem;}
  h1{font-size:2rem;}
  .fc-word{font-size:3rem;}
}

</style>
</head>

</script>
<script>
/* ===================== 全域状态 ===================== */
/* 简繁转换：所有词汇/题库资料在建置时已离线转换好两种字形，
   不依赖任何外部字形转换服务，离线开启也能正常运作。 */
let SCRIPT = 'simplified'; // 'simplified' | 'traditional'

function convVocab(text){ // UI 固定文字，原始为简体
  if(!text) return text;
  if(SCRIPT==='traditional') return UI_S2T[text] || text;
  return text;
}

const LS_KEY = 'cvocab_unfamiliar_v1';
function loadUnfam(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function saveUnfam(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(unfamiliar)); }catch(e){} }
let unfamiliar = loadUnfam();
function unfamKey(level, key){ return level+':'+key; }
function isUnfam(level,key){ return !!unfamiliar[unfamKey(level,key)]; }
function toggleUnfam(level,wordObj){
  const k = unfamKey(level,wordObj.key);
  if(unfamiliar[k]){ delete unfamiliar[k]; } else { unfamiliar[k] = {key:wordObj.key, level:level, ws:wordObj.ws, wt:wordObj.wt}; }
  saveUnfam();
}
function unfamCount(){ return Object.keys(unfamiliar).length; }

const TIERS = { basic: {key:'basic', name:'基础', color:'basic', range:'TOCFL 1–3级・HSK 1–3级・中检 准4级–4级', tocfl:'1–3级', hsk:'1–3级', zhongjian:'准4级–4级', cefr:'A1–A2', levels:['1','2','3']} };

function wordDisp(w){ return SCRIPT==='traditional' ? w.wt : w.w; }
function dw(w){ return SCRIPT==='traditional' ? w.wt : w.ws; } // 依目前字形即时显示（不受切换时机影响）
function exDisp(w){ if(!w.ex) return ''; return SCRIPT==='traditional' ? w.ex.t : w.ex.s; }
function getWordList(level){
  // key: 固定用简体作为唯一识别码（不随字形切换改变），ws/wt: 简体/繁体显示，w: 依目前字形显示
  if(level === '7-9') return DATA.hsk789.map(w=>({key:w.w, w:wordDisp(w), ws:w.w, wt:w.wt, p:w.p, j:'', pos:w.pos, en:w.en||[], ex:w.ex||null}));
  return (DATA.hsk16[level]||[]).map(w=>({key:w.w, w:wordDisp(w), ws:w.w, wt:w.wt, p:w.p,j:w.j,pos:'', en:w.en||[], ex:w.ex||null}));
}
function levelLabel(level){ return level==='7-9' ? 'HSK 7–9级' : ('HSK '+level+'级'); }

const POS_MAP = {'动':'动词','名':'名词','形':'形容词','副':'副词','量':'量词','介':'介词','连':'连词','连、':'连词','助':'助词','数量':'数量词','数':'数词','代':'代词','叹':'叹词','拟声':'拟声词'};
function posLabel(pos){
  if(!pos) return '';
  return pos.split('、').map(p=>POS_MAP[p]||p).join('、');
}

/* ===================== 路由 / 画面状态 ===================== */
let view = { screen:'tier', tier:'basic', level:'all', module:null };

function goHome(){ view={screen:'tier', tier:'basic', level:'all', module:null}; render(); window.scrollTo(0,0); }
function goTier(tierKey){ view = {screen:'tier', tier:tierKey, level:'all', module:null}; render(); window.scrollTo(0,0); }
function setLevel(lv){ view.level = lv; render(); }
function goModule(moduleKey){
  view.module = moduleKey;

}
function backToTier(){ view.screen='tier'; view.module=null; render(); window.scrollTo(0,0); }
function goUnfamPanel(){ view = {screen:'unfam', tier:null, level:'all', module:null}; render(); window.scrollTo(0,0); }

function setScript(s){
  SCRIPT = s;
  render();
}

/* ===================== Render root ===================== */
function render(){
  const app = document.getElementById('app');
  let html = renderTopbar();
  if(view.screen==='home') html += renderHome();

/* ===================== 进度自动保存 / 恢复 ===================== */
const APP_STATE_KEY = 'cvocab_app_state_v1';
function saveAppState(){
  try{
    localStorage.setItem(APP_STATE_KEY, JSON.stringify({ view, SCRIPT, fc, ls, pc, cz, tp }));
  }catch(e){}
}
function loadAppState(){
  try{
    const raw = localStorage.getItem(APP_STATE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function restoreAppState(){
  const saved = loadAppState();
  if(!saved) return;
  if(saved.SCRIPT) SCRIPT = saved.SCRIPT;
  if(saved.view) view = saved.view;
  if(saved.fc) fc = Object.assign(fc, saved.fc);
  if(saved.ls) ls = Object.assign(ls, saved.ls);
  if(saved.pc) pc = Object.assign(pc, saved.pc);
  if(saved.cz) cz = Object.assign(cz, saved.cz);
  if(saved.tp) tp = Object.assign(tp, saved.tp);
}

}

/* ===================== MODULE 1：词语卡 ===================== */
let fc = {pool:[], order:[], idx:0, flipped:false, onlyUnfam:false};
function startFlashcard(){
  const pool = tierWordPool(view.tier, view.level);
  fc.pool = pool;
  fc.onlyUnfam = false;
  buildFcOrder();
  fc.idx = 0; fc.flipped = false;
}
function buildFcOrder(){
  let list = fc.pool;
  if(fc.onlyUnfam) list = list.filter(w=>isUnfam(w.level,w.key));
  fc.order = list.map((_,i)=>i);
  shuffleArr(fc.order);
  fc.activeList = list;
  fc.idx = 0; fc.flipped=false;
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fcCurrent(){ if(!fc.activeList || fc.activeList.length===0) return null; return fc.activeList[fc.order[fc.idx]]; }
function fcAutoSpeakBack(){ const w = fcCurrent(); if(w && w.ex) speak(exDisp(w), 0.85); }
function fcFlip(){
  fc.flipped = !fc.flipped;
  render();
  if(fc.flipped) fcAutoSpeakBack();
}
function fcNext(){ if(!fc.activeList.length) return; fc.idx = (fc.idx+1)%fc.activeList.length; fc.flipped=false; render(); }
function fcPrev(){ if(!fc.activeList.length) return; fc.idx = (fc.idx-1+fc.activeList.length)%fc.activeList.length; fc.flipped=false; render(); }
function fcShuffle(){ shuffleArr(fc.order); fc.idx=0; fc.flipped=false; render(); }
function fcToggleOnlyUnfam(){ fc.onlyUnfam = !fc.onlyUnfam; buildFcOrder(); render(); }
function fcMarkUnfam(){ const w = fcCurrent(); if(!w) return; toggleUnfam(w.level, w); render(); }

function renderFlashcard(){
  const w = fcCurrent();
  const total = fc.activeList ? fc.activeList.length : 0;
  return `
  <div class="fc-wrap">
    <div class="btn-row">
      <button class="unfam-btn ${fc.onlyUnfam?'on':''}" onclick="fcToggleOnlyUnfam()">⭐ ${convVocab('只看不熟')} (${fc.pool.filter(w=>isUnfam(w.level,w.key)).length})</button>
      <button class="btn secondary" onclick="fcShuffle()">🔀 ${convVocab('随机排序')}</button>
    </div>
    <div class="fc-progress">${total===0?convVocab('没有词语'):(fc.idx+1)+' / '+total}</div>
    ${!w ? `<div class="fc-card"><div class="fc-empty">${convVocab('这个范围目前没有词语，换个等级或取消「只看不熟」试试。')}</div></div>` : `
    <div class="fc-card" onclick="fcFlip()">
      ${!fc.flipped ? `
        <div class="fc-word">${dw(w)}</div>
      ` : `
        <div class="fc-back">
          <div class="fc-word-small">${dw(w)}</div>
          <div class="fc-pinyin">${w.p||''}</div>
          ${w.en && w.en.length ? `<div class="fc-en">🇬🇧 ${w.en.join('；')}</div>` : ''}
          ${w.j ? `<div class="fc-jp">🇯🇵 ${w.j}</div>` : (w.pos?`<div class="fc-jp" style="opacity:.6;font-size:1.05rem;">${convVocab('词性')}：${posLabel(w.pos)}（${convVocab('日文翻译尚未收录')}）</div>`:'')}
          ${w.ex ? `<div class="fc-example" onclick="event.stopPropagation();speak(exDisp(w),0.85)">📖 ${exDisp(w)} <span class="fc-example-audio">🔊</span></div>` : `<div class="fc-example fc-example-pending">${convVocab('例句建置中')}</div>`}
        </div>
      `}
    </div>
    <div class="fc-controls">
      <button class="icon-btn" onclick="event.stopPropagation();fcPrev()" title="${convVocab('上一个')}">◀</button>
      ${fc.flipped ? `<button class="icon-btn active" onclick="event.stopPropagation();fcAutoSpeakBack()" title="${convVocab('重播')}">🔊</button>` : ''}
      <button class="unfam-btn ${isUnfam(w.level,w.key)?'on':''}" onclick="event.stopPropagation();fcMarkUnfam()">⭐ ${convVocab('不熟')}</button>
      <button class="icon-btn" onclick="event.stopPropagation();fcNext()" title="${convVocab('下一个')}">▶</button>
    </div>
    `}
  </div>`;
}

/* ===================== MODULE 2：听语音选词语（单/双/三音节各10题，共30题） ===================== */
let ls = {pool:[], queue:[], idx:0, correct:0, wrong:0, answered:false, selected:null, done:false};
function startListen(){
  ls.pool = tierWordPool(view.tier, view.level).filter(w=>w.w && w.w.length>0);
  buildListenQueue();
}
function pickPriUnfam(list, n){
  const unfam = list.filter(w=>isUnfam(w.level,w.key));
  const rest = list.filter(w=>!isUnfam(w.level,w.key));
  shuffleArr(unfam); shuffleArr(rest);
  let chosen = unfam.slice(0,n);
  if(chosen.length<n) chosen = chosen.concat(rest.slice(0, n-chosen.length));
  return chosen;
}
function bucketBySyll(pool){
  const buckets = {1:[],2:[],3:[]};
  pool.forEach(w=>{ const len = (w.ws||w.w||'').length; if(buckets[len]) buckets[len].push(w); });
  return buckets;
}
function buildListenOptions(answer, sameLenPool){
  let candidates = sameLenPool.filter(w=>w.key!==answer.key);
  shuffleArr(candidates);
  let picks = candidates.slice(0,3);
  let opts = picks.concat([answer]);
  shuffleArr(opts);
  return opts;
}
function buildListenQueue(){
  const buckets = bucketBySyll(ls.pool);
  let chosen = [];
  [1,2,3].forEach(len=>{
    const picked = pickPriUnfam(buckets[len], 10);
    picked.forEach(w=>chosen.push({w, len}));
  });
  if(chosen.length===0){ ls.queue = []; return; }
  shuffleArr(chosen);
  ls.queue = chosen.map(item=>({answer:item.w, len:item.len, options: buildListenOptions(item.w, buckets[item.len])}));
  ls.idx=0; ls.correct=0; ls.wrong=0; ls.answered=false; ls.selected=null; ls.done=false;
}
function lsSpeak(){ const q = ls.queue[ls.idx]; if(!q) return; speak(dw(q.answer), 0.75); }
function lsSelect(key){
  if(ls.answered) return;
  const q = ls.queue[ls.idx];
  ls.selected = key;
  ls.answered = true;
  if(key === q.answer.key){ ls.correct++; }
  else { ls.wrong++; }
  render();
}
function lsNext(){
  if(ls.idx < ls.queue.length-1){ ls.idx++; ls.answered=false; ls.selected=null; render(); setTimeout(lsSpeak,250); }
  else { ls.done = true; render(); }
}
function lsRestart(){ buildListenQueue(); render(); setTimeout(lsSpeak,250); }
const SYLL_LABEL = {1:'单音节',2:'双音节',3:'三音节'};

function renderListen(){
  if(!ls.queue || ls.queue.length===0){
    return `<div class="listen-wrap"><div class="fc-empty">${convVocab('这个范围词语不足，换个等级试试。')}</div></div>`;
  }
  if(ls.done){
    const pct = Math.round(ls.correct/(ls.correct+ls.wrong)*100)||0;
    return `<div class="listen-wrap">
      <h3>${convVocab('本轮完成！')}</h3>
      <div class="score-badges"><span class="badge-good">✅ ${convVocab('答对')} ${ls.correct}</span><span class="badge-bad">❌ ${convVocab('答错')} ${ls.wrong}</span><span>${pct}%</span></div>
      <button class="btn tier" onclick="lsRestart()">🔁 ${convVocab('再练一轮')}</button>
    </div>`;
  }
  const q = ls.queue[ls.idx];
  return `
  <div class="listen-wrap">
    <span class="cat-tag">${convVocab(SYLL_LABEL[q.len])}</span>
    <div class="fc-progress">${ls.idx+1} / ${ls.queue.length}　　<span class="badge-good">✅${ls.correct}</span> <span class="badge-bad">❌${ls.wrong}</span></div>
    <button class="speaker-btn" onclick="lsSpeak()">🔊</button>
    <div class="opt-grid">
      ${q.options.map(o=>{
        let cls='opt-btn';
        if(ls.answered){
          if(o.key===q.answer.key) cls+=' correct';
          else if(o.key===ls.selected) cls+=' wrong';
        }
        return `<button class="${cls}" ${ls.answered?'disabled':''} onclick="lsSelect('${o.key.replace(/'/g,"\\'")}')">${dw(o)}</button>`;
      }).join('')}
    </div>

let pc = {pool:[], queue:[], idx:0, correct:0, wrong:0, answered:false, selected:null, done:false};
function startPinyin(){
  pc.pool = tierWordPool(view.tier, view.level).filter(w=>w.p);
  buildPinyinQueue();
}
const TONE_MAP = {
  'a':['ā','á','ǎ','à','a'], 'o':['ō','ó','ǒ','ò','o'], 'e':['ē','é','ě','è','e'],
  'i':['ī','í','ǐ','ì','i'], 'u':['ū','ú','ǔ','ù','u'], 'ü':['ǖ','ǘ','ǚ','ǜ','ü']
};
const TONE_REV = {};
Object.keys(TONE_MAP).forEach(base=>{ TONE_MAP[base].forEach((ch,idx)=>{ TONE_REV[ch] = [base, idx]; }); });
function randomToneShift(py){
  const chars = py.split('');
  const idxs = [];
  chars.forEach((c,i)=>{ if(TONE_REV[c]) idxs.push(i); });
  if(!idxs.length) return null;
  const pick = idxs[Math.floor(Math.random()*idxs.length)];
  const info = TONE_REV[chars[pick]];
  const base = info[0], curTone = info[1];
  let newTone;
  do{ newTone = Math.floor(Math.random()*5); } while(newTone===curTone);
  chars[pick] = TONE_MAP[base][newTone];
  return chars.join('');
}
const FINAL_SWAPS = [['ng','n'],['an','ang'],['in','ing'],['en','eng'],['ong','eng']];
const INITIAL_SWAPS = [['zh','z'],['ch','c'],['sh','s'],['l','n'],['f','h'],['r','l']];
function randomFinalSwap(py){
  const opts = FINAL_SWAPS.filter(p=>py.indexOf(p[0])>=0||py.indexOf(p[1])>=0);
  if(!opts.length) return null;
  const pair = opts[Math.floor(Math.random()*opts.length)];
  if(py.indexOf(pair[0])>=0) return py.replace(pair[0], pair[1]);
  return py.replace(pair[1], pair[0]);
}
function randomInitialSwap(py){
  const opts = INITIAL_SWAPS.filter(p=>py.indexOf(p[0])===0||py.indexOf(p[1])===0);
  if(!opts.length) return null;
  const pair = opts[Math.floor(Math.random()*opts.length)];
  if(py.indexOf(pair[0])===0) return pair[1]+py.slice(pair[0].length);
  return pair[0]+py.slice(pair[1].length);
}
function genPinyinDistractor(py, avoid){
  const fns = [randomToneShift, randomFinalSwap, randomInitialSwap];
  for(let attempt=0; attempt<15; attempt++){
    const fn = fns[Math.floor(Math.random()*fns.length)];
    const res = fn(py);
    if(res && res!==py && avoid.indexOf(res)<0) return res;
  }
  return null;
}
function buildPinyinOptions(w){
  const py = w.p||'';
  let distractors = [];
  for(let i=0;i<15 && distractors.length<3;i++){
    const d = genPinyinDistractor(py, [py].concat(distractors));
    if(d) distractors.push(d);
  }
  if(distractors.length<3){
    let others = pc.pool.filter(o=>o.key!==w.key && o.p && o.p!==py && distractors.indexOf(o.p)<0);
    shuffleArr(others);
    for(const o of others){ if(distractors.length>=3) break; distractors.push(o.p); }
  }
  let opts = distractors.slice(0,3).concat([py]);
  shuffleArr(opts);
  return opts;
}
function buildPinyinQueue(){
  if(pc.pool.length===0){ pc.queue = []; return; }
  const n = Math.min(30, pc.pool.length);
  const chosen = pickPriUnfam(pc.pool, n);
  pc.queue = chosen.map(w=>({answer:w, options: buildPinyinOptions(w)}));
  pc.idx=0; pc.correct=0; pc.wrong=0; pc.answered=false; pc.selected=null; pc.done=false;
}
function pcSelect(opt){
  if(pc.answered) return;
  const q = pc.queue[pc.idx];
  pc.selected = opt;
  pc.answered = true;
  if(opt === q.answer.p){ pc.correct++; } else { pc.wrong++; }
  render();
  speak(dw(q.answer));
}
function pcNext(){
  if(pc.idx < pc.queue.length-1){ pc.idx++; pc.answered=false; pc.selected=null; render(); }
  else { pc.done = true; render(); }
}
function pcRestart(){ buildPinyinQueue(); render(); }
function renderPinyinChoice(){
  if(!pc.queue || pc.queue.length===0){
    return `<div class="listen-wrap"><div class="fc-empty">${convVocab('这个范围词语不足，换个等级试试。')}</div></div>`;
  }
  if(pc.done){
    const pct = Math.round(pc.correct/(pc.correct+pc.wrong)*100)||0;
    return `<div class="listen-wrap">
      <h3>${convVocab('本轮完成！')}</h3>
      <div class="score-badges"><span class="badge-good">✅ ${convVocab('答对')} ${pc.correct}</span><span class="badge-bad">❌ ${convVocab('答错')} ${pc.wrong}</span><span>${pct}%</span></div>
      <button class="btn tier" onclick="pcRestart()">🔁 ${convVocab('再练一轮')}</button>
    </div>`;
  }
  const q = pc.queue[pc.idx];
  return `
  <div class="listen-wrap">
    <div class="fc-progress">${pc.idx+1} / ${pc.queue.length}　　<span class="badge-good">✅${pc.correct}</span> <span class="badge-bad">❌${pc.wrong}</span></div>
    <div class="pinyin-word">${dw(q.answer)}</div>
    <div class="opt-grid">
      ${q.options.map(o=>{
        let cls='opt-btn';
        if(pc.answered){
          if(o===q.answer.p) cls+=' correct';
          else if(o===pc.selected) cls+=' wrong';
        }
        return `<button class="${cls}" ${pc.answered?'disabled':''} onclick="pcSelect('${o.replace(/'/g,"\\'")}')">${o}</button>`;
      }).join('')}
    </div>
    ${pc.answered ? `<button class="btn tier" onclick="pcNext()">${pc.idx<pc.queue.length-1?convVocab('下一题')+' →':convVocab('查看结果')}</button>` : ''}
  </div>`;
}

let _voices = [];
function loadVoices(){ _voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function speak(text, rate){
  if(!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const lang = SCRIPT==='traditional' ? 'zh-TW' : 'zh-CN';
  const wantNames = SCRIPT==='traditional' ? ['meijia','美佳'] : ['tingting','婷婷'];
  u.lang = lang;
  u.rate = rate || 0.75;
  const v = _voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('zh') && wantNames.some(n=>(v.name||'').toLowerCase().includes(n)))
         || _voices.find(v=>v.lang && v.lang.replace('_','-').toLowerCase()===lang.toLowerCase())
         || _voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('zh'));
  if(v) u.voice = v;
  window.speechSynthesis.speak(u);
}

/* ===================== 启动 ===================== */
window.addEventListener('DOMContentLoaded', function(){
  restoreAppState();
  render();
});

</script>
</body>
